# SAGE onboarding org templates — pre-built team structures offered by the
# onboarding wizard (GET /onboarding/org-templates). Kept as DATA here, not
# hardcoded in src/, so the framework stays domain-blind (SOUL.md). Add or
# edit templates freely; no code change needed.
templates:
- id: starter
  name: General Engineering Team
  description: Analyst, Developer, Planner, Monitor — works for any software domain
  role_count: 4
  compliance_standards: []
  icon: ⚙️
  roles:
  - key: analyst
    name: Signal Analyst
    description: Triage logs and errors
  - key: developer
    name: Code Reviewer
    description: Review MRs and code changes
  - key: planner
    name: Task Planner
    description: Decompose complex requests
  - key: monitor
    name: Monitor
    description: Watch systems and alert
